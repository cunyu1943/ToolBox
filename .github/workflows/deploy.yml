name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前安装，才能启用 cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          # GitHub Pages 项目站点是 <user>.github.io/<repo>/ 子路径，资源前缀必须带上仓库名。
          # 若改成用户站点（<user>.github.io）或绑定了自定义域名，把此值换成 /。
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Verify build output
        # 前置检查：产物缺失或深链壳没生成就 fail，避免把空白页部署上线
        run: |
          set -e
          test -f dist/index.html
          test -f dist/tools/json-format/index.html
          test -f dist/404.html
          grep -q '/ToolBox/assets/' dist/index.html || { echo "::error::资源前缀不是 /ToolBox/，base 没生效"; exit 1; }

      - name: Add .nojekyll
        # 关键：禁用 Jekyll，否则含下划线的资源目录会被忽略导致 404 白屏
        run: touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"

      - name: Write URL to job summary
        run: |
          echo "## 部署完成 :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "访问地址：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
